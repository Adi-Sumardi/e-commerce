name: CI & Auto Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    # `next build` statically prerenders pages that use SiteHeader (categories
    # query) and similar server components — it needs a REAL, reachable MySQL
    # to do that, not just a placeholder DATABASE_URL string. Without this
    # service, "Build (standalone output)" fails on literally every run
    # (verified: every workflow run since this pipeline was added had failed
    # here). An empty schema is enough — pages just render with empty lists.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: ci_build
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # MUST run before type check/lint/build — @prisma/client's generated
      # types only exist after this runs. It used to work by accident via
      # @prisma/client's own postinstall hook firing during `pnpm install`,
      # but that depends on pnpm's build-script-approval state and isn't
      # reliable (confirmed: this exact job order intermittently failed
      # "Type check" with "no exported member" errors from @prisma/client).
      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: "mysql://root@127.0.0.1:3306/ci_build"

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Apply migrations to CI database
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: "mysql://root@127.0.0.1:3306/ci_build"

      - name: Build (standalone output)
        run: pnpm build
        env:
          DATABASE_URL: "mysql://root@127.0.0.1:3306/ci_build"
          NEXTAUTH_SECRET: "build-placeholder"
          AUTH_SECRET: "build-placeholder"
          NEXTAUTH_URL: "https://pratamajaya.id"

  # Deploy nyata dipegang oleh Hostinger native git-deploy (hPanel > Redeploy),
  # BUKAN lewat job ini — job "Deploy to Hostinger" yang lama selalu gagal
  # karena nunjuk ke ~/repo yang tidak pernah di-clone di server, jadi
  # dihapus supaya CI tidak melapor "failure" palsu untuk step yang memang
  # tidak pernah bisa jalan. Kalau suatu saat mau benar-benar pindah ke
  # auto-deploy lewat SSH di sini, ~/repo harus di-clone & di-setup manual
  # dulu di server (lihat deploy/README.md) sebelum job ini diaktifkan lagi.

