# Izin build script dependency, dalam DUA format:
# - allowBuilds: dibaca pnpm >= 11 (dipakai builder Hostinger)
# - onlyBuiltDependencies/ignoredBuiltDependencies: dibaca pnpm 10 (dev lokal)
# Versi yang tidak mengenal format satunya akan mengabaikannya. Kalau mengubah
# salah satu, ubah juga pasangannya.

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  # esbuild sengaja false KHUSUS builder Hostinger (pnpm 11): postinstall-nya
  # cuma validasi versi binary, dan gagal EACCES di sana. esbuild hanya dipakai
  # tsx untuk seed, yang tidak jalan di builder. Di lokal (pnpm 10, daftar
  # onlyBuiltDependencies di bawah) tetap diizinkan.
  esbuild: false
  sharp: false
  unrs-resolver: false

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
