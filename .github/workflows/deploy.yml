name: Deploy to Hostinger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Build (standalone output)
        run: pnpm build
        env:
          # DATABASE_URL cuma dibutuhkan Prisma supaya format connection-string-nya
          # valid saat build (tidak ada query beneran ke DB di tahap ini) — BUKAN
          # kredensial produksi asli. Kredensial asli cuma dipakai di job `deploy`
          # (lewat secrets.DATABASE_URL), disuntik ke server via file .env, tidak
          # pernah dipakai buat konek langsung dari runner GitHub ke MySQL Hostinger.
          DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build_placeholder"
          NEXTAUTH_SECRET: "build-placeholder"
          AUTH_SECRET: "build-placeholder"
          NEXTAUTH_URL: "https://pratamajaya.id"

      - name: Assemble standalone bundle
        run: |
          set -e
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/* .next/standalone/.next/static/
          cp -r prisma .next/standalone/prisma
          # jangan bawa folder upload lokal dari runner (harusnya memang kosong,
          # tapi jaga-jaga supaya deploy tidak pernah menimpa /public/uploads di server)
          rm -rf .next/standalone/public/uploads
          mkdir -p .next/standalone/public/uploads

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone
          retention-days: 1

  deploy:
    name: Deploy to Hostinger
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone-build
          path: standalone

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Write production .env
        run: |
          cat > standalone/.env <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET=${{ secrets.AUTH_SECRET }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          NEXTAUTH_URL=https://pratamajaya.id
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          XENDIT_SECRET_KEY=${{ secrets.XENDIT_SECRET_KEY }}
          XENDIT_WEBHOOK_TOKEN=${{ secrets.XENDIT_WEBHOOK_TOKEN }}
          BITESHIP_API_KEY=${{ secrets.BITESHIP_API_KEY }}
          BITESHIP_WEBHOOK_SECRET=${{ secrets.BITESHIP_WEBHOOK_SECRET }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EOF

      - name: Sync build to server
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            --exclude 'public/uploads' \
            standalone/ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.APP_PATH }}/"

      - name: Run database migrations
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.APP_PATH }}' && DATABASE_URL='${{ secrets.DATABASE_URL }}' npx --yes prisma@6.19.3 migrate deploy"

      - name: Restart application (Passenger)
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ secrets.APP_PATH }}/tmp' && touch '${{ secrets.APP_PATH }}/tmp/restart.txt'"
