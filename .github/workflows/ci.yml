name: CI & Auto Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Build (standalone output)
        run: pnpm build
        env:
          DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build_placeholder"
          NEXTAUTH_SECRET: "build-placeholder"
          AUTH_SECRET: "build-placeholder"
          NEXTAUTH_URL: "https://pratamajaya.id"

  deploy:
    name: Deploy to Hostinger
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH update script on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || '65002' }}
          script: |
            cd ~/repo
            git pull origin main
            bash deploy/update.sh

